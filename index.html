<!doctype html>

    <!-- Primary Meta Tags -->
    <title>KnowTheFile — 100% Private, On-Device PDF & Document Suite</title>
    <meta name="title" content="KnowTheFile — 100% Private, On-Device PDF & Document Suite" />

    <link rel="apple-touch-icon" href="/kf-logo.png" />

    <!-- JSON-LD Structured Data: WebSite & WebApplication -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://knowthefile.web.app/tools?category={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://knowthefile.web.app/#organization",
          "name": "KnowTheFile",
          "url": "https://knowthefile.web.app/",

            "@type": "ImageObject",
            "url": "https://knowthefile.web.app/kf-logo.png",

            "height": 512

          "@type": "WebApplication",

        }
